# Cloud Run configuration, baked into the web image at /app/cloud.toml (C2-5).
#
# Only values that differ from the code defaults belong here. Every field in
# config.py has a default and every section may be omitted, so a short file is
# the correct outcome, not an unfinished one.
#
# What must NOT be here:
#   - Secrets of any kind. config.py rejects unknown fields with "秘密只能透過環境注入",
#     and this file ships inside a public repository and a public image layer.
#   - The Supabase pooler host and role name. They identify the project and stay in
#     DB_HOST / DB_USER (deployment settings), never in the repository.
#   - [tls]. The cloud has no company CA and no relaxed providers; the defaults are
#     already empty, so the section is omitted rather than written as empty (C6-1).
#
# Supplied by the environment instead (C6-2):
#   DB_HOST, DB_PORT, DB_NAME, DB_SCHEMA, DB_USER   plain deployment settings
#   DB_PASSWORD                                     Secret Manager
#   PORT                                            the platform
#   WEB_ALLOWED_HOSTS, WEB_ALLOWED_ORIGINS          C2-2
#
# Omitted on purpose, with their defaults left in force:
#   [providers]  valuation defaults to yahoo, and Dashboard clears comparison anyway
#                (dashboard.py:96), so the cloud service calls no keyed provider.
#   database timeout fields retain the defaults (connect 10s / statement 10s / lock 3s).
#   C5-4 applies session values after connecting and verifies each with SHOW.

[database]
# Public Supabase CA, verified against the live session pooler (C5-3).
sslmode = "verify-full"
sslrootcert = "/app/supabase-ca.crt"

[scheduler]
# The whole-refresh limit (C4-1), now measured rather than assumed.
#
#   125.0  Cloudflare cuts a Worker's subrequest here; 124s was the last value that got
#          through, 130/150/300/600 all died at 125.0-125.2 with a 524 (C7-2). The cap is
#          at the edge, so Cloud Run's own request timeout cannot raise it.
#   - 3.5  worst measured Cloud Run cold start, min=0, 1 vCPU / 1 GiB, three samples
#          (3.418 / 2.300 / 2.448s end to end). Every idle refresh pays this.
#   - 1.0  wrap-up after the deadline: compose the message, write the job row.
#   - 2.0  residual overrun -- int() truncation of the per-cycle budget, batch granularity.
#   =118.5 theoretical ceiling; 110 leaves 8.5s of margin for variance.
#
# Do not raise this without re-measuring the edge cap. Going over it does not degrade
# gracefully: the app keeps working past the point where the connection is already gone,
# and the user gets a failure instead of the partial result C4-1 is designed to return.
refresh_deadline_seconds = 110
#
# refresh_max_tickers stays unset (0 = bounded by the deadline alone). C7-6 has not
# measured what a single ticker actually costs against the real sources from GCP, and a
# cap guessed without that number would silently defer holdings for no reason. The
# deadline already bounds the work; the cap exists to bound it more predictably once the
# per-ticker cost is known.

[instruments]
# A week, against the 24-hour default. D3 completes refreshes inside the request, and a
# catalog judged stale makes run_job fetch the whole official listing first
# (dashboard.py), adding an unbounded external fetch to a request that already has a
# deadline. A longer window keeps that off the critical path; the listing is also
# refreshable on demand from the dashboard.
max_age_hours = 168

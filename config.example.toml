# Database, instruments, providers, quote limits and monitor scheduling are implemented.
# Copy to ignored config.toml for local customization.

[database]
host = "postgres" # For an app container on infrastructure_default; host CLI: localhost.
port = 5432
name = "stock_quote_fetcher"
schema = "app"
user = "stock_quote_app"
# Password is injected via DB_PASSWORD; never store it here.
sslmode = "disable" # Local container on a private network. Remote databases: verify-full.
# sslmode accepts disable / require / verify-ca / verify-full only. libpq's prefer and
# allow fall back to plaintext without saying so, so they are rejected (C5-3).
# sslrootcert applies to verify-ca / verify-full; "system" uses the OS trust store.

[providers]
valuation = "yahoo" # Initial implementation only; final US source remains undecided.
comparison = ["twse", "tpex"] # Add "finnhub" after injecting FINNHUB_API_KEY.

[scheduler]
poll_interval_seconds = 60
operation_timeout_seconds = 10
cycle_budget_seconds = 50
max_retries = 2
campaign_duration_days = 7 # New campaigns; matching active campaigns resume automatically.
post_close_observation_minutes = 30 # Cap used when a provider delay/publication time is unknown.
heartbeat_interval_seconds = 30

[instruments]
max_age_hours = 168 # Keeps a restart inside a multi-day campaign loadable; refresh before starting one.
operation_timeout_seconds = 30

# [tls] is deliberately absent (C6-1). Its three fields — company_ca_file,
# relaxed_providers and relaxed_sources — exist only to get through a TLS-intercepting
# corporate proxy, and every one of them weakens certificate verification. Shipping them
# here as an empty template invited copying them into a deployment that does not need
# them. The fields still work when set in an ignored config.toml; config.py defaults all
# three to off, so omitting the section is the same as the old empty values.
#
# Cloud deployments must not set them: deploy/cloud.toml omits [tls] entirely, and the
# image is built with no company_ca build secret so the Dockerfile's conditional mounts
# skip (D6).

